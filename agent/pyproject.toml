[project]
name = "agent-service"
version = "0.1.0"
description = "Deep research agent service"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12",
  "fastapi>=0.115",
  "httpx>=0.28",
  "openai>=1.60",
  "opik>=2.2.73",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
e2b = ["e2b>=1.0"]
redis = ["redis>=5"]
oss = ["oss2>=2.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service", "src/research_engine"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
