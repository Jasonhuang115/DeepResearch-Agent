[project]
name = "agent-service"
version = "0.1.0"
description = "Deep research agent service"
requires-python = ">=3.12"
dependencies = [
  "aiokafka>=0.12",
  "fastapi>=0.115",
  "openai>=1.60",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_service", "src/research_engine"]

[tool.uv]
package = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
